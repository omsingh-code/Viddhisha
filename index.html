<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Vidhisha 💖</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .home-container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: slideUp 0.8s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cute-gif {
      width: 200px;
      height: 200px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 2.5rem;
      color: #667eea;
      margin-bottom: 20px;
      font-weight: 700;
    }

    p {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.8;
      margin-bottom: 30px;
      white-space: pre-line;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .buttons a {
      display: inline-block;
      padding: 15px 25px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .buttons a:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
    }

    .buttons a.love-btn {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
    }

    .buttons a.love-btn:hover {
      box-shadow: 0 8px 20px rgba(245, 87, 108, 0.6);
    }

    @media (max-width: 600px) {
      .home-container {
        padding: 25px;
        margin: 20px;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 0.95rem;
      }

      .cute-gif {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>
<body>

<div class="overlay"></div>

<div class="home-container">
  <img class="cute-gif" src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Cute animation">

  <h1>Dear Vidhisha 💌</h1>

  <p>Distance alag kar sakti hai,
feelings nahi...

Yeh website sirf ek diary nahi,
balki hamare emotions ka small universe hai ✨</p>

  <div class="buttons">
    <a href="details.html">Your Details 💕</a>
    <a href="day1.html">Start 14 Days Journey 🌸</a>
    <a href="final-decision.html">Final Decision 💭</a>
    <a href="longdistance.html" class="love-btn">Miles Apart, Hearts Together 💞</a>
  </div>
</div>

</body>
</html>
